name: Materialize implementation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[materialize-zoro-gateways]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and validate implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-* | base64 --decode > /tmp/zoro-implementation.tgz
          tar -tzf /tmp/zoro-implementation.tgz >/dev/null
          tar -xzf /tmp/zoro-implementation.tgz -C .
          rm -rf .payload .bootstrap .github/workflows/bootstrap.yml

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify implementation
        run: npm run ci

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement Zoro gateway platform'
          git push origin HEAD:main
